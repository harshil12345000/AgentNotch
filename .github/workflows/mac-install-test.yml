name: mac-install-test

# Checks what a new Mac user does: the one-line installer, and opening the downloaded zip.
on:
  workflow_dispatch:

jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build this commit
        working-directory: mac
        run: chmod +x bundle.sh && ./bundle.sh

      - name: One-line installer
        run: |
          curl -fsSL https://agentnotch-six.vercel.app/install.sh | sh
          sleep 6
          pgrep -lf "Applications/AgentNotch.app" || (echo "AgentNotch is not running from ~/Applications" && exit 1)
          "$HOME/Applications/AgentNotch.app/Contents/MacOS/AgentNotch" --status
          mkdir -p shots && screencapture -x shots/after-installer.png || true
          "$HOME/Applications/AgentNotch.app/Contents/MacOS/AgentNotch" --quit; sleep 2
          rm -rf "$HOME/Applications/AgentNotch.app" "$HOME/Library/Application Support/AgentNotch"

      - name: Downloaded zip moves itself to ~/Applications
        run: |
          mkdir -p "$HOME/Downloads/n" && cd "$HOME/Downloads/n"
          cp "$GITHUB_WORKSPACE/mac/dist/AgentNotch-mac.zip" AgentNotch-mac.zip
          chk() { if pgrep -x AgentNotch >/dev/null; then echo "alive after: $1"; else echo "DEAD after: $1"; fi; }
          ditto -x -k AgentNotch-mac.zip .
          mkdir -p "$HOME/.claude" && echo '{"hooks":{"Stop":[{"hooks":[{"type":"command","command":"echo mine"}]}]}}' > "$HOME/.claude/settings.json"
          mkdir -p "$HOME/Library/Application Support/AgentNotch" && echo '{"approveInTerminal": true}' > "$HOME/Library/Application Support/AgentNotch/config.json"
          open AgentNotch.app
          sleep 8
          mkdir -p "$GITHUB_WORKSPACE/shots" && screencapture -x "$GITHUB_WORKSPACE/shots/after-launch.png" || true
          pgrep -lf "$HOME/Applications/AgentNotch.app" || (echo "did not relocate to ~/Applications" && exit 1)
          echo "--- hooks after first launch"
          "$HOME/Applications/AgentNotch.app/Contents/MacOS/AgentNotch" --hooks-status
          grep -c "Applications/AgentNotch.app/Contents/MacOS/AgentNotch" "$HOME/.claude/settings.json"
          python3 -c "import json,os; v=json.load(open(os.path.expanduser('~/.claude/settings.json')))['hooks']; assert v['Stop'][0]['hooks'][0]['command']=='echo mine', 'existing hook must stay first'; print('existing hook kept first; events with hooks:', len(v))"
          echo "--- a simulated session through the hook"
          B="$HOME/Applications/AgentNotch.app/Contents/MacOS/AgentNotch"
          echo '{"session_id":"ci-1","cwd":"/tmp/demo","hook_event_name":"UserPromptSubmit"}' | "$B" --hook
          echo '{"session_id":"ci-1","cwd":"/tmp/demo","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"swift test"}}' | "$B" --hook
          chk "two hook events"; sleep 1
          (echo '{"session_id":"ci-1","cwd":"/tmp/demo","hook_event_name":"PermissionRequest","tool_name":"Bash","tool_input":{"command":"git push"}}' | "$B" --hook > /tmp/decision.txt) &
          sleep 2; chk "permission request"
          "$B" --decide ci-1 allow || true
          sleep 2; chk "decide"
          echo "permission hook returned: $(cat /tmp/decision.txt)"
          echo "--- still running?"
          pgrep -lf "Applications/AgentNotch.app" || echo "NOTCH IS NOT RUNNING ANY MORE"
          ls "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null | grep -i notch || echo "no crash reports"
          for f in "$HOME"/Library/Logs/DiagnosticReports/AgentNotch*; do
            [ -f "$f" ] || continue
            echo "=== $f"
            grep -o -E '"(type|signal|indicator|symbol)" ?: ?"[^"]*"' "$f" | head -60 || head -c 2000 "$f"
          done
          echo "--- windows the app has on screen"
          swift -e 'import CoreGraphics; import Foundation; let l = CGWindowListCopyWindowInfo([.optionAll], kCGNullWindowID) as! [[String: Any]]; for w in l where (w["kCGWindowOwnerName"] as? String) == "AgentNotch" { print(w["kCGWindowBounds"] ?? "", "layer", w["kCGWindowLayer"] ?? "", "onscreen", w["kCGWindowIsOnscreen"] ?? "no", "alpha", w["kCGWindowAlpha"] ?? "") }' || true
          cd "$GITHUB_WORKSPACE" && mkdir -p shots && screencapture -x shots/after-zip.png || true
          tail -5 "$HOME/Library/Application Support/AgentNotch/notch.log" || true

      - name: Find where the app stops
        run: |
          B="$HOME/Applications/AgentNotch.app/Contents/MacOS/AgentNotch"
          pkill -x AgentNotch || true; sleep 1
          "$B" --no-install > /tmp/app.out 2>&1 &
          sleep 5
          chk() { if pgrep -x AgentNotch >/dev/null; then echo "alive after: $1"; else echo "DEAD after: $1"; fi; }
          chk "start"
          echo '{"session_id":"ci-2","cwd":"/tmp/demo","hook_event_name":"UserPromptSubmit"}' | "$B" --hook; sleep 2; chk "UserPromptSubmit"
          echo '{"session_id":"ci-2","cwd":"/tmp/demo","hook_event_name":"PreToolUse","tool_name":"Bash","tool_input":{"command":"swift test"}}' | "$B" --hook; sleep 2; chk "PreToolUse"
          (echo '{"session_id":"ci-2","cwd":"/tmp/demo","hook_event_name":"PermissionRequest","tool_name":"Bash","tool_input":{"command":"git push"}}' | "$B" --hook > /tmp/decision2.txt) &
          sleep 3; chk "PermissionRequest"
          screencapture -x "$GITHUB_WORKSPACE/shots/pending.png" || true
          "$B" --decide ci-2 allow || true
          sleep 2; chk "decide"
          echo "permission hook returned: $(cat /tmp/decision2.txt)"
          echo '{"session_id":"ci-2","cwd":"/tmp/demo","hook_event_name":"Stop"}' | "$B" --hook; sleep 2; chk "Stop"
          sleep 12
          echo "--- app output"; cat /tmp/app.out
          echo "--- crash reports"; ls -la "$HOME/Library/Logs/DiagnosticReports/" 2>/dev/null || true
          for f in "$HOME"/Library/Logs/DiagnosticReports/AgentNotch*; do
            [ -f "$f" ] || continue
            grep -o -E '"(type|signal|indicator|symbol)" ?: ?"[^"]*"' "$f" | head -70
          done
          tail -8 "$HOME/Library/Application Support/AgentNotch/notch.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test
          path: shots
